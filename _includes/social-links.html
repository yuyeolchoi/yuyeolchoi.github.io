<div class="social-links" aria-label="Research and professional profiles">
  {% if site.author.email != "" %}
    <a href="mailto:{{ site.author.email }}">Email</a>
  {% endif %}
  {% if site.social.orcid != "" %}
    <a href="{{ site.social.orcid }}" rel="me">ORCID</a>
  {% endif %}
  {% if site.social.scholar != "" %}
    <a href="{{ site.social.scholar }}">Google Scholar</a>
  {% endif %}
  {% if site.social.github != "" %}
    <a href="{{ site.social.github }}" rel="me">GitHub</a>
  {% endif %}
  {% if site.social.linkedin != "" %}
    <a href="{{ site.social.linkedin }}" rel="me">LinkedIn</a>
  {% endif %}
</div>
