<header class="site-header">
  <div class="container header-inner">
    <a class="site-identity" href="{{ '/' | relative_url }}" aria-label="{{ site.author.name }} home">
      <span class="identity-mark" aria-hidden="true">{{ site.author.initials }}</span>
      <span>
        <strong>{{ site.author.name }}</strong>
        <small>{{ site.author.role }}</small>
      </span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="sr-only">Toggle navigation</span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign current = false %}
        {% if page.url == item.url %}
          {% assign current = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
