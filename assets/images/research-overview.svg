      <text x="657" y="912" fill="#52606d" font-size="19">descriptors and mechanisms</text>
    </g>

    <g>
      <rect x="210" y="995" width="480" height="76" rx="24" fill="#0b5d75"/>
      <text x="450" y="1043" fill="#ffffff" font-size="24" font-weight="800">Published catalyst design insight</text>
