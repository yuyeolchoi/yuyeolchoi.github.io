<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title description">
  <title id="title">Research overview: heterogeneous catalysis for C1 chemistry and hydrogen production</title>
  <desc id="description">A schematic linking methane, carbon dioxide, and hydrogen carriers to zeolite, metal oxide, and supported metal catalysts, yielding selective conversion and hydrogen production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfc"/>
      <stop offset="0.55" stop-color="#e7f2f4"/>
      <stop offset="1" stop-color="#c9e2e8"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf7f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#173f5f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0b5d75"/>
    </marker>
  </defs>

  <rect width="900" height="1125" rx="48" fill="url(#bg)"/>
  <g opacity="0.22" stroke="#76a9b5" stroke-width="2" fill="none">
    <path d="M92 150c150-86 250 30 396-55 97-56 193-31 320 62"/>
    <path d="M74 934c158-116 296 11 432-75 119-75 225-15 315 66"/>
    <circle cx="140" cy="260" r="4" fill="#0b5d75"/>
    <circle cx="744" cy="324" r="4" fill="#0b5d75"/>
    <circle cx="210" cy="856" r="4" fill="#0b5d75"/>
    <circle cx="702" cy="813" r="4" fill="#0b5d75"/>
  </g>

  <text x="450" y="88" text-anchor="middle" fill="#073f50" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">
    RESEARCH OVERVIEW
  </text>
  <text x="450" y="128" text-anchor="middle" fill="#52606d" font-family="Arial, sans-serif" font-size="20">
    Heterogeneous catalysis for C1 chemistry and hydrogen
  </text>

  <g filter="url(#shadow)">
    <rect x="92" y="190" width="716" height="180" rx="28" fill="url(#node)" stroke="#b8d3da" stroke-width="2"/>
    <text x="450" y="235" text-anchor="middle" fill="#0b5d75" font-family="Arial, sans-serif" font-size="20" font-weight="700">FEEDSTOCKS AND CARRIERS</text>
    <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
      <circle cx="235" cy="298" r="46" fill="#ffffff" stroke="#0b5d75" stroke-width="3"/>
      <text x="235" y="306" fill="#17212b" font-size="24">CH4</text>
      <circle cx="450" cy="298" r="46" fill="#ffffff" stroke="#0b5d75" stroke-width="3"/>
      <text x="450" y="306" fill="#17212b" font-size="24">CO2</text>
      <circle cx="665" cy="298" r="46" fill="#ffffff" stroke="#0b5d75" stroke-width="3"/>
      <text x="665" y="306" fill="#17212b" font-size="24">LOHC</text>
    </g>
  </g>

  <path d="M450 385v86" fill="none" stroke="#0b5d75" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="485" width="716" height="255" rx="28" fill="#ffffff" stroke="#b8d3da" stroke-width="2"/>
    <text x="450" y="532" text-anchor="middle" fill="#0b5d75" font-family="Arial, sans-serif" font-size="20" font-weight="700">CATALYST DESIGN</text>

    <g transform="translate(148 565)">
      <polygon points="58,0 116,34 116,101 58,135 0,101 0,34" fill="#e8f3f5" stroke="#0b5d75" stroke-width="3"/>
      <path d="M0 34h116M0 101h116M58 0v135" stroke="#7fb0ba" stroke-width="2"/>
      <text x="58" y="174" text-anchor="middle" fill="#17212b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Zeolites</text>
    </g>

    <g transform="translate(386 565)">
      <circle cx="64" cy="66" r="62" fill="#e8f3f5" stroke="#0b5d75" stroke-width="3"/>
      <circle cx="38" cy="47" r="12" fill="#0b5d75"/>
      <circle cx="82" cy="42" r="10" fill="#76a9b5"/>
      <circle cx="61" cy="84" r="14" fill="#0b5d75"/>
      <circle cx="98" cy="91" r="9" fill="#76a9b5"/>
      <text x="64" y="174" text-anchor="middle" fill="#17212b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Metal oxides</text>
    </g>

    <g transform="translate(610 565)">
      <rect x="0" y="72" width="128" height="36" rx="18" fill="#e8f3f5" stroke="#0b5d75" stroke-width="3"/>
      <circle cx="36" cy="55" r="22" fill="#0b5d75"/>
      <circle cx="76" cy="47" r="16" fill="#76a9b5"/>
      <circle cx="100" cy="72" r="13" fill="#0b5d75"/>
      <text x="64" y="174" text-anchor="middle" fill="#17212b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Supported metals</text>
    </g>

    <text x="450" y="705" text-anchor="middle" fill="#52606d" font-family="Arial, sans-serif" font-size="18">
      descriptors • active sites • metal-support interactions
    </text>
  </g>

  <path d="M450 755v86" fill="none" stroke="#0b5d75" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="92" y="855" width="716" height="185" rx="28" fill="#ffffff" stroke="#b8d3da" stroke-width="2"/>
    <text x="450" y="902" text-anchor="middle" fill="#0b5d75" font-family="Arial, sans-serif" font-size="20" font-weight="700">OUTCOMES</text>
    <g font-family="Arial, sans-serif" text-anchor="middle" font-size="18" fill="#17212b" font-weight="700">
      <rect x="140" y="935" width="170" height="62" rx="31" fill="#e8f3f5" stroke="#0b5d75" stroke-width="2"/>
      <text x="225" y="960">Selective</text>
      <text x="225" y="984">conversion</text>
      <rect x="365" y="935" width="170" height="62" rx="31" fill="#e8f3f5" stroke="#0b5d75" stroke-width="2"/>
      <text x="450" y="960">Hydrogen</text>
      <text x="450" y="984">production</text>
      <rect x="590" y="935" width="170" height="62" rx="31" fill="#e8f3f5" stroke="#0b5d75" stroke-width="2"/>
      <text x="675" y="960">Gas capture</text>
      <text x="675" y="984">and separation</text>
    </g>
  </g>
</svg>
