<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title description">
  <title id="title">Research overview workflow</title>
  <desc id="description">Workflow linking heterogeneous catalyst design, experimental catalysis, DFT descriptor analysis, and published catalyst design insight.</desc>
  <rect width="900" height="1125" rx="42" fill="#f7f9fa"/>
  <circle cx="738" cy="138" r="138" fill="#e8f3f5"/>
  <circle cx="172" cy="948" r="154" fill="#e8f3f5"/>
  <g fill="none" stroke="#8eb8c3" stroke-width="3">
    <path d="M450 238 C520 300 560 368 560 445"/>
    <path d="M450 565 C378 626 340 700 340 785"/>
    <path d="M450 565 C520 632 560 708 560 785"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="450" y="118" fill="#073f50" font-size="42" font-weight="800">Research Overview</text>
    <text x="450" y="165" fill="#52606d" font-size="24">Experimental catalysis + DFT descriptors</text>

    <g>
      <rect x="185" y="220" width="530" height="128" rx="28" fill="#ffffff" stroke="#d9e1e5" stroke-width="3"/>
