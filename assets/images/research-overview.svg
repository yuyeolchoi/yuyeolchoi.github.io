      <text x="450" y="492" fill="#0b5d75" font-size="26" font-weight="800">Reaction Systems</text>
      <text x="450" y="535" fill="#52606d" font-size="20">C1 conversion and hydrogen production</text>
    </g>

    <g>
      <rect x="78" y="785" width="330" height="145" rx="28" fill="#ffffff" stroke="#d9e1e5" stroke-width="3"/>
      <text x="243" y="842" fill="#0b5d75" font-size="25" font-weight="800">Experiments</text>
      <text x="243" y="884" fill="#52606d" font-size="19">Synthesis, reaction tests,</text>
      <text x="243" y="912" fill="#52606d" font-size="19">structure-performance trends</text>
    </g>

    <g>
